base_model: Abner0803/Qwen3-1.7B-icl-3shot-dpo-irr_doc

adapter: lora
lora_r: 16
lora_alpha: 16
lora_dropout: 0.05
lora_target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj

datasets:
  - path: ./data/msmarco-icl-100shot-v4-id_only/train_cd_only.jsonl
    type: chat_template
    chat_template: tokenizer_default_fallback_chatml
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles:
      assistant:
        - assistant
        - gpt
        - model
      user:
        - user
        - human
      system:
        - system

roles_to_train: ["assistant"]
train_on_eos: "turn"

output_dir: ./checkpoint/Qwen3-1.7B-icl-100shot-lora-1e-5
sequence_len: 3000
sample_packing: true
pad_to_sequence_len: true
flash_attention: false
xformers_attention: false
flex_attention: false
sdp_attention: true

gradient_accumulation_steps: 32
micro_batch_size: 4
dataloader_num_workers: 4
num_epochs: 2

optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 1e-5
warmup_ratio: 0.05
weight_decay: 0.0
bf16: true
tf32: false
gradient_checkpointing: true

logging_steps: 50
save_strategy: epoch
save_total_limit: 2

special_tokens:
  additional_special_tokens:
    - "[COPY]"
  eos_token: <|im_end|>

wandb_project: "ICLGR-MSMARCO-S2"
wandb_entity: "abnerden0803-national-taiwan-university"
wandb_name: "qwen-1.7b-icl-100shot-lora-1e-5"
wandb_log_model:
wandb_watch:

val_set_size: 0.0
