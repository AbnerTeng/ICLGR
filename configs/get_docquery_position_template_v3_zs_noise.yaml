input_path: "./data/msmarco-ICL-100k"
zs_input_path: "./data/msmarco_text-with_pseudo_query-100k-gr/train.jsonl"
dataset_name: "msmarco"
n_shot: 3
output_dir: "./data/msmarco-docquery-100k-3shot_v3_zs_noise"

zs_noise: true                  # generate all_noise from stage1 data (476k unique)

type_ratios:
  doc_pos_front: 0.25           # 2/8 of n_queries ≈ 16k (unique)
  doc_pos_back:  0.25           # 2/8 of n_queries ≈ 16k (unique)
                                # all_noise unset → keep all 476k unique
                                # stage1 unset → keep all (476k retrieval + 82k indexing)
