input_path: "./data/msmarco-item-id-hardneg"
zs_input_path: "./data/msmarco_text-with_pseudo_query-100k-gr/train.jsonl"
dataset_name: "msmarco"
n_shot: 3
output_dir: "./data/msmarco-docquery-100k-3shot_v3_retrieval_hn"

zs_noise: false                 # do not generate all_noise from stage1 queries
hard_negative: false            # do not use BM25
retrieval_hard_neg: true        # use pre-computed dense retrieval hard_negatives from data

type_ratios:
  doc_pos_front: 0.125          # ≈ 8k unique
  doc_pos_back:  0.125          # ≈ 8k unique
                                # all_noise unset → keep all
                                # stage1 unset → keep all
