base_model: Qwen/Qwen3-1.7B-Base
datasets:
  - path: /mnt/raid0/home/abner/git/ICLGR/nq_text_title_axolotl/train_with_pseudo_axolotl.jsonl
    type: chat_template
    chat_template: tokenizer_default_fallback_chatml
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles:
      assistant:
        - assistant
        - gpt
        - model
      user:
        - user
        - human
      system:
        - system
    roles_to_train: ["assistant"]
    train_on_eos: "turn"
  - path: /mnt/raid0/home/abner/git/ICLGR/nq_text_title_axolotl/icl_train_with_pseudo_axolotl.jsonl
    type: chat_template
    chat_template: tokenizer_default_fallback_chatml
    field_messages: conversations
    message_property_mappings:
      role: role
      content: content
    roles:
      assistant:
        - assistant
        - gpt
        - model
      user:
        - user
        - human
      system:
        - system
    roles_to_train: ["assistant"]
    train_on_eos: "turn"

streaming: false
shuffle_merged_datasets: true
output_dir: /mnt/raid0/home/abner/git/ICLGR/checkpoints/Qwen3-1.7B-Base-nq-baseline-scratch
sequence_len: 2048
sample_packing: false
flash_attention: false
xformers_attention: false
flex_attention: false
sdp_attention: true
overrides_of_model_config:
  _attn_implementation: "sdpa"

gradient_accumulation_steps: 64
micro_batch_size: 2
num_epochs: 10

optimizer: adamw_torch
lr_scheduler: cosine
learning_rate: 0.0001
warmup_ratio: 0.1
weight_decay: 0.0
bf16: true
tf32: false
gradient_checkpointing: true

logging_steps: 50
save_strategy: steps
save_steps: 1000
save_total_limit: 3

special_tokens:
  eos_token: "<|im_end|>"

val_set_size: 0.0
wandb_project: ICLGR-NQ
wandb_entity: abnerden0803-national-taiwan-university
wandb_watch:
wandb_name: qwen3-1.7b-base-nq-baseline-scratch
wandb_log_model:
