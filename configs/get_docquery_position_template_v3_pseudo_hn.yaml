input_path: "./data/msmarco-pseudo-hardneg"
zs_input_path: null             # pseudo queries already in input_path, no extra zs data needed
dataset_name: "msmarco"
n_shot: 3
output_dir: "./data/msmarco-docquery-pseudo-hn-3shot_v3"

zs_noise: false                 # do not use BM25 noise
hard_negative: false            # do not use BM25 hard negatives
retrieval_hard_neg: true        # use pre-computed dense retrieval hard_negatives from data

type_ratios:
  doc_pos_front: 0.125          # 1/8 of n_queries (~60k unique)
  doc_pos_back:  0.125          # 1/8 of n_queries (~60k unique)
                                # all_noise unset → keep all
                                # stage1 unset → keep all retrieval + indexing
