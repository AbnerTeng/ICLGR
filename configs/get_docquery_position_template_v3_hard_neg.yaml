input_path: "./data/msmarco-ICL-100k"
zs_input_path: "./data/msmarco_text-with_pseudo_query-100k-gr/train.jsonl"
dataset_name: "msmarco"
n_shot: 3
output_dir: "./data/msmarco-docquery-100k-3shot_v3_hard_neg"

zs_noise: false                 # do not generate all_noise from stage1 queries
hard_negative: true             # use BM25 to select hard negatives instead of random noise
hard_negative_k: 20             # take top-20 similar docs per query, then sample n_shot from them

type_ratios:
  doc_pos_front: 0.125          # ≈ 8k unique
  doc_pos_back:  0.125          # ≈ 8k unique
                                # all_noise unset → keep all 64k hard negatives
                                # stage1 unset → keep all (476k retrieval + 82k indexing)
