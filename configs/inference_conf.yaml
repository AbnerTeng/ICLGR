# Constrained decoding mode: base | copy | dual_tag
# base:     TrieConstrainedLogitsProcessor         (no tag, plain trie)
# copy:     TrieConstrainedLogitsProcessorWithTag  ([COPY] -> context trie, else main trie)
# dual_tag: TrieConstrainedLogitsProcessorWithDualTag ([COPY] -> context, [RETRIEVE] -> main)
processor_type: "copy"
# HuggingFace corpus repo to build the global docid trie from (uses doc_id field, indexing split)
# Leave empty to fall back to local train_file/new_file
hf_corpus: "Lala8383/msmarco-item-id-lower"
output_file: "./retrieve_results/Qwen3-1.7B-icl-3shot-v4_128k-copy_tag_test_3shot_all.json"

